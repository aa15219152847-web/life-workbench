<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="生活工作台">
<meta name="theme-color" content="#0A2540">
<link rel="manifest" href="manifest.json?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="app-icon-v3-192.png">
<link rel="apple-touch-icon" href="app-icon-v3-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="app-icon-v3-180.png">
<title>生活工作台</title>
<style>
:root{
  /* Navy Gold 藏金 — 金融级浅底高级感 */
  --bg:#F8FAFC;
  --bg-2:#EFF6FF;
  --sidebar:#0A2540;
  --surface:#FFFFFF;
  --surface-2:#F1F5F9;
  --surface-3:#E2E8F0;
  --surface-hover:#F8FAFC;
  --border:rgba(10,37,64,.08);
  --border-2:rgba(10,37,64,.12);
  --border-hover:rgba(10,37,64,.18);
  --text:#000000;
  --text-2:#0F1B2D;
  --text-3:#2C405E;
  --text-4:#6B8099;
  --primary:#635BFF;
  --primary-2:#4F46E5;
  --primary-glow:rgba(99,91,255,.1);
  --primary-glow-2:rgba(99,91,255,.05);
  --primary-grad:linear-gradient(135deg,#635BFF 0%,#4F46E5 100%);
  --green:#059669;
  --green-glow:rgba(5,150,105,.08);
  --green-grad:linear-gradient(135deg,#10B981 0%,#059669 100%);
  --red:#DC2626;
  --red-glow:rgba(220,38,38,.08);
  --red-grad:linear-gradient(135deg,#EF4444 0%,#DC2626 100%);
  --amber:#C7A84B;
  --amber-glow:rgba(199,168,75,.1);
  --amber-grad:linear-gradient(135deg,#D4AF37 0%,#C7A84B 100%);
  --gold:#C7A84B;
  --gold-glow:rgba(199,168,75,.08);
  --radius:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --radius-xs:8px;
  --sidebar-w:76px;
  --sidebar-w-expanded:240px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-standard:cubic-bezier(.4,0,.2,1);
  --glass:rgba(248,250,252,.8);
  --glass-border:rgba(10,37,64,.1);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  background-image:url(bg-glass.jpg);
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  background-repeat:no-repeat;
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  display:flex;
  font-feature-settings:"cv02","cv03","cv04","cv11";
  position:relative;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:rgba(248,250,252,.35);
  backdrop-filter:blur(0px);
  z-index:0;
  pointer-events:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:all .2s var(--ease-standard)}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
textarea{resize:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:0;height:0;display:none}

/* ============================================================
   侧边栏 — 玻璃拟态 + 弹性展开
   ============================================================ */
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:rgba(10,37,64,.85);
  backdrop-filter:blur(20px) saturate(1.5);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
  border-right:1px solid rgba(255,255,255,.08);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:calc(20px + var(--safe-top)) 0 calc(20px + var(--safe-bottom));
  position:relative;
  z-index:2;
  transition:width .35s var(--ease-out);
}
.sidebar:hover{width:var(--sidebar-w-expanded)}

.sidebar-logo{
  width:44px;height:44px;
  border-radius:14px;
  background:transparent;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:28px;
  flex-shrink:0;
  transition:transform .3s var(--ease-spring);
  overflow:hidden;
}
.sidebar-logo img{
  width:100%;height:100%;object-fit:cover;border-radius:14px;
}
.sidebar:hover .sidebar-logo{transform:scale(1.05)}

.sidebar-nav{
  display:flex;flex-direction:column;gap:6px;
  width:100%;padding:0 14px;flex:1;
}

.nav-item{
  display:flex;align-items:center;gap:14px;
  padding:12px 14px;
  border-radius:var(--radius-md);
  color:rgba(255,255,255,.45);
  font-size:13.5px;font-weight:500;
  white-space:nowrap;
  position:relative;
  transition:all .2s var(--ease-standard);
}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7)}
.nav-item.active{
  background:rgba(99,91,255,.15);
  color:#A5B4FC;
}
.nav-item.active::before{
  content:'';position:absolute;left:-2px;top:50%;transform:translateY(-50%);
  width:3px;height:24px;border-radius:0 4px 4px 0;
  background:linear-gradient(135deg,#C7A84B,#D4AF37);
  box-shadow:0 0 12px rgba(199,168,75,.5);
}
.nav-item svg{width:22px;height:22px;stroke-width:1.8;flex-shrink:0}
.nav-item .nav-label{
  opacity:0;transform:translateX(-6px);
  transition:all .3s var(--ease-out) .05s;
}
.sidebar:hover .nav-item .nav-label{opacity:1;transform:none}

.sidebar-footer{
  margin-top:auto;padding-top:16px;
  width:100%;text-align:center;
}
.sidebar-time{
  font-size:11px;color:rgba(255,255,255,.3);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  opacity:0;transition:opacity .3s;
}
.sidebar:hover .sidebar-time{opacity:1}

/* ============================================================
   主区域
   ============================================================ */
.main-area{
  flex:1;
  display:flex;flex-direction:column;
  min-width:0;
  height:100vh;
  height:100dvh;
  position:relative;
  z-index:1;
}

/* 粘性顶部栏 — 玻璃拟态 */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(24px + var(--safe-top)) 36px 20px;
  flex-shrink:0;
}
.topbar-titles h1{
  font-size:28px;font-weight:700;letter-spacing:-.8px;
  background:linear-gradient(135deg,#000000 0%,#0F1B2D 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1.2;
}
.topbar-titles .date{
  font-size:14px;color:var(--text-2);margin-top:4px;
  font-variant-numeric:tabular-nums;letter-spacing:.2px;
  font-weight:600;
}

/* ============================================================
   Bento Grid 概览卡片
   ============================================================ */
.overview{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  padding:0 36px 10px;
  flex-shrink:0;
}
.ov-card{
  background:rgba(255,255,255,.45);
  backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
  border:1px solid rgba(255,255,255,.55);
  border-radius:var(--radius);
  box-shadow:0 4px 24px rgba(10,37,64,.08);
  padding:20px;
  position:relative;overflow:hidden;
  transition:all .3s var(--ease-out);
}
.ov-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);
}
.ov-card:hover{
  border-color:rgba(255,255,255,.75);
  transform:translateY(-2px);
  box-shadow:0 8px 30px rgba(10,37,64,.12);
  background:rgba(255,255,255,.55);
}
.ov-card .ov-icon{
  position:absolute;top:18px;right:18px;
  width:32px;height:32px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  opacity:.6;
}
.ov-card .ov-icon svg{width:17px;height:17px}
.ov-card .label{
  font-size:13px;color:var(--text-2);
  letter-spacing:.5px;font-weight:700;
}
.ov-card .value{
  font-size:28px;font-weight:700;margin-top:8px;
  font-variant-numeric:tabular-nums;letter-spacing:-1px;
  line-height:1.1;color:var(--text);
}
.ov-card .sub{font-size:13px;color:var(--text-2);margin-top:4px;font-weight:600}
.ov-card .accent-bar{
  position:absolute;bottom:0;left:0;right:0;height:2px;
  background:var(--primary-grad);
  opacity:.5;
  transition:opacity .3s;
}
.ov-card:hover .accent-bar{opacity:1}
.ov-card.green .accent-bar{background:var(--green-grad)}
.ov-card.red .accent-bar{background:var(--red-grad)}
.ov-card.amber .accent-bar{background:var(--amber-grad)}

/* 内容滚动区 */
.content{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:10px 36px calc(48px + var(--safe-bottom));
  scroll-behavior:smooth;
}

.section{display:none}
.section.active{display:block;animation:sectionIn .4s var(--ease-out)}
@keyframes sectionIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin:24px 0 16px;
}
.section-title{
  font-size:15px;color:var(--text);
  letter-spacing:.3px;font-weight:700;
  display:flex;align-items:center;gap:10px;
}
.section-title::before{
  content:'';width:4px;height:16px;border-radius:3px;
  background:var(--primary-grad);
  box-shadow:0 0 8px rgba(99,91,255,.25);
}
.section-count{
  font-size:13px;color:var(--text-2);
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  padding:5px 12px;border-radius:8px;
  font-variant-numeric:tabular-nums;font-weight:600;
  border:1px solid rgba(255,255,255,.6);
}

/* ============================================================
   卡片通用 — 亮度差分层
   ============================================================ */
.card-base{
  background:rgba(255,255,255,.45);
  backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
  border:1px solid rgba(255,255,255,.55);
  border-radius:var(--radius);
  box-shadow:0 4px 24px rgba(10,37,64,.08);
  transition:all .25s var(--ease-out);
}
.card-base:hover{border-color:rgba(255,255,255,.75);background:rgba(255,255,255,.55)}

/* ============================================================
   待办 — 签名动效：完成时的粒子散开
   ============================================================ */
.todo-item{
  display:flex;align-items:flex-start;gap:14px;
  padding:18px 20px;
  background:rgba(255,255,255,.45);
  backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
  border:1px solid rgba(255,255,255,.55);
  border-radius:var(--radius-md);
  margin-bottom:10px;
  box-shadow:0 4px 24px rgba(10,37,64,.08);
  transition:all .25s var(--ease-out);
  position:relative;
}
.todo-item:hover{border-color:rgba(255,255,255,.75);background:rgba(255,255,255,.55);transform:translateX(2px)}
.todo-check{
  width:24px;height:24px;flex-shrink:0;
  border:1.5px solid var(--border-hover);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  margin-top:1px;transition:all .25s var(--ease-spring);
  cursor:pointer;
  position:relative;
}
.todo-check:hover{border-color:var(--primary);transform:scale(1.08)}
.todo-check.done{
  background:var(--primary-grad);border-color:transparent;
  box-shadow:0 3px 12px rgba(99,91,255,.3);
}
.todo-check.done svg{opacity:1;animation:checkPop .4s var(--ease-spring)}
@keyframes checkPop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.todo-check svg{opacity:0;transition:opacity .15s}
.todo-body{flex:1;min-width:0}
.todo-title{font-size:16px;font-weight:600;word-break:break-word;letter-spacing:-.2px;line-height:1.45;color:var(--text)}
.todo-item.done .todo-title{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--text-4)}
.todo-meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tag{
  font-size:12.5px;padding:4px 10px;border-radius:7px;
  font-weight:600;letter-spacing:.2px;
  background:var(--primary-glow);color:var(--primary);
}
.tag.cat-life{background:var(--green-glow);color:var(--green)}
.tag.cat-work{background:var(--primary-glow);color:var(--primary)}
.tag.cat-study{background:var(--amber-glow);color:var(--amber)}
.tag.p1{background:var(--red-glow);color:var(--red)}
.tag.done-tag{background:var(--green-glow);color:var(--green)}
.todo-actions{display:flex;gap:2px;opacity:0;transition:opacity .2s}
.todo-item:hover .todo-actions{opacity:1}
.remind-btn{
  display:inline-flex;align-items:center;gap:5px;
  margin-top:10px;padding:8px 14px;
  background:var(--amber-glow);color:var(--amber);
  border-radius:9px;font-size:13px;font-weight:700;
  border:1px solid rgba(251,191,36,.15);
  transition:all .2s var(--ease-standard);
}
.remind-btn:hover{background:rgba(251,191,36,.18);transform:translateX(2px)}
.sync-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:8px 14px;border-radius:9px;
  background:var(--primary-glow);color:var(--primary);
  font-size:13px;font-weight:700;
  border:1px solid rgba(99,91,255,.15);
  transition:all .2s var(--ease-standard);
}
.sync-btn:hover{background:rgba(129,140,248,.18)}
.icon-btn{
  width:32px;height:32px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);
}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}

/* ============================================================
   记账
   ============================================================ */
.ledger-summary{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:rgba(10,37,64,.08);
  border-radius:var(--radius-md);overflow:hidden;
  margin-bottom:16px;
  border:1px solid rgba(255,255,255,.55);
  box-shadow:0 4px 24px rgba(10,37,64,.08);
}
.ls-cell{
  background:rgba(255,255,255,.45);
  backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
  padding:20px 18px;
  display:flex;flex-direction:column;gap:5px;
}
.ls-cell .l{font-size:13px;color:var(--text-2);letter-spacing:.3px;font-weight:600}
.ls-cell .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.6px}
.ls-cell.income .v{color:var(--green)}
.ls-cell.expense .v{color:var(--red)}

.ledger-item{
  display:flex;align-items:center;gap:14px;
  padding:16px 20px;
  background:rgba(255,255,255,.45);
  backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
  border:1px solid rgba(255,255,255,.55);
  border-radius:var(--radius-md);
  margin-bottom:8px;
  box-shadow:0 4px 24px rgba(10,37,64,.08);
  transition:all .25s var(--ease-out);
}
.ledger-item:hover{border-color:rgba(255,255,255,.75);background:rgba(255,255,255,.55);transform:translateX(2px)}
.ledger-icon{
  width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.ledger-icon.expense{background:var(--red-glow)}
.ledger-icon.income{background:var(--green-glow)}
.ledger-body{flex:1;min-width:0}
.ledger-cat{font-size:16px;font-weight:600;letter-spacing:-.2px;color:var(--text)}
.ledger-note{font-size:13.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;font-weight:500}
.ledger-right{text-align:right;flex-shrink:0}
.ledger-amount{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.ledger-amount.expense{color:var(--red)}
.ledger-amount.income{color:var(--green)}
.ledger-date{font-size:13px;color:var(--text-2);margin-top:2px;font-weight:500}

/* ============================================================
   资讯
   ============================================================ */
.news-tabs{display:flex;gap:8px;margin-bottom:16px}
.news-tab{
  padding:10px 22px;border-radius:24px;font-size:14px;font-weight:700;
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:var(--text-2);
  border:1px solid rgba(255,255,255,.5);
  transition:all .2s var(--ease-standard);
}
.news-tab:hover{border-color:var(--border-hover)}
.news-tab.active{
  background:var(--primary-glow);color:var(--primary);
  border-color:rgba(129,140,248,.2);
}
.news-item{
  padding:18px 20px;
  background:rgba(255,255,255,.45);
  backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
  border:1px solid rgba(255,255,255,.55);
  border-radius:var(--radius-md);
  margin-bottom:8px;
  box-shadow:0 4px 24px rgba(10,37,64,.08);
  display:block;
  transition:all .25s var(--ease-out);
}
.news-item:hover{border-color:rgba(255,255,255,.75);background:rgba(255,255,255,.55);transform:translateX(3px)}
.news-title{font-size:16px;font-weight:700;line-height:1.45;letter-spacing:-.2px;color:var(--text)}
.news-summary{font-size:14px;color:var(--text-2);margin-top:8px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}
.news-meta{display:flex;gap:10px;margin-top:12px;font-size:13px;color:var(--text-2);align-items:center;font-weight:500}
.news-source{
  color:var(--primary);font-weight:700;
  padding:3px 10px;border-radius:7px;
  background:var(--primary-glow);
}
.news-dot{width:3px;height:3px;border-radius:50%;background:var(--text-4)}

/* ============================================================
   灵感
   ============================================================ */
.insp-item{
  padding:18px 20px;
  background:rgba(255,255,255,.45);
  backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
  border:1px solid rgba(255,255,255,.55);
  border-radius:var(--radius-md);
  margin-bottom:8px;
  box-shadow:0 4px 24px rgba(10,37,64,.08);
  transition:all .25s var(--ease-out);
  border-left:3px solid transparent;
}
.insp-item:hover{border-color:rgba(255,255,255,.75);background:rgba(255,255,255,.55);border-left-color:var(--primary)}
.insp-content{font-size:16px;line-height:1.65;white-space:pre-wrap;word-break:break-word;letter-spacing:-.1px;color:var(--text);font-weight:500}
.insp-meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.insp-time{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums;font-weight:500}

/* ============================================================
   学习计划
   ============================================================ */
.plan-item{
  padding:20px;
  background:rgba(255,255,255,.45);
  backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
  border:1px solid rgba(255,255,255,.55);
  border-radius:var(--radius-md);
  margin-bottom:10px;
  box-shadow:0 4px 24px rgba(10,37,64,.08);
  transition:all .25s var(--ease-out);
}
.plan-item:hover{border-color:rgba(255,255,255,.75);background:rgba(255,255,255,.55)}
.plan-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.plan-title{font-size:17px;font-weight:700;flex:1;letter-spacing:-.3px;color:var(--text)}
.plan-checkin-btn{
  padding:9px 18px;border-radius:11px;font-size:12.5px;font-weight:700;
  background:var(--primary-glow);color:var(--primary);
  flex-shrink:0;letter-spacing:.3px;
  transition:all .2s var(--ease-standard);
}
.plan-checkin-btn:hover{background:rgba(129,140,248,.2);transform:scale(1.03)}
.plan-checkin-btn.done{background:var(--green-glow);color:var(--green)}
.plan-stats{display:flex;gap:28px;margin-top:16px}
.plan-stat{font-size:13px;color:var(--text-2);letter-spacing:.2px;font-weight:600}
.plan-stat b{color:var(--text);font-size:18px;font-weight:700;margin-right:3px;font-variant-numeric:tabular-nums}
.progress-bar{height:6px;background:rgba(255,255,255,.05);border-radius:4px;margin-top:16px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary-grad);border-radius:4px;transition:width .6s var(--ease-out);box-shadow:0 0 8px rgba(99,91,255,.25)}
.plan-note{font-size:13.5px;color:var(--text-2);margin-top:8px;line-height:1.5;font-weight:500}
.plan-actions{display:flex;gap:2px;margin-top:14px;justify-content:flex-end}

/* ============================================================
   复盘
   ============================================================ */
.review-form-card{
  background:rgba(255,255,255,.45);
  backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
  border:1px solid rgba(255,255,255,.55);
  border-radius:var(--radius);
  box-shadow:0 4px 24px rgba(10,37,64,.08);
  padding:24px;
}
.review-field{margin-bottom:18px}
.review-field label{display:block;font-size:13px;color:var(--text);margin-bottom:8px;letter-spacing:.3px;font-weight:700}
.review-field textarea{
  width:100%;min-height:76px;padding:14px 16px;
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(10,37,64,.1);
  border-radius:var(--radius-sm);font-size:14px;line-height:1.6;
  transition:border-color .2s;
}
.review-field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow-2)}
.review-field textarea::placeholder{color:var(--text-4)}
.mood-picker{display:flex;gap:8px}
.mood-btn{
  flex:1;padding:14px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(10,37,64,.1);
  font-size:24px;text-align:center;
  transition:all .25s var(--ease-spring);
}
.mood-btn:hover{border-color:var(--border-hover);transform:scale(1.05)}
.mood-btn.active{
  background:var(--primary-glow);border-color:rgba(129,140,248,.2);
  transform:scale(1.08);
  box-shadow:0 4px 16px var(--primary-glow-2);
}
.review-history-item{
  padding:18px 20px;
  background:rgba(255,255,255,.45);
  backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);
  border:1px solid rgba(255,255,255,.55);
  border-radius:var(--radius-md);
  margin-bottom:8px;
  box-shadow:0 4px 24px rgba(10,37,64,.08);
  transition:all .25s var(--ease-out);
}
.review-history-item:hover{border-color:rgba(255,255,255,.75)}
.rh-date{font-size:15px;font-weight:700;color:var(--primary);margin-bottom:10px;letter-spacing:-.2px}
.rh-row{font-size:14px;margin-top:8px;line-height:1.6;color:var(--text-2);font-weight:500}
.rh-row .k{
  display:inline-block;width:20px;
  color:var(--text-3);font-weight:700;
}

/* ============================================================
   浮动按钮 — 玻璃拟态 + 发光
   ============================================================ */
.fab{
  position:fixed;right:32px;bottom:calc(32px + var(--safe-bottom));z-index:90;
  width:56px;height:56px;border-radius:18px;
  background:var(--primary-grad);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 28px rgba(99,91,255,.35),0 2px 8px rgba(10,37,64,.1),inset 0 1px 0 rgba(255,255,255,.2);
  transition:all .25s var(--ease-spring);
}
.fab:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 12px 36px rgba(99,91,255,.45)}
.fab:active{transform:scale(.9)}
.fab svg{width:26px;height:26px}

/* ============================================================
   模态框 — 玻璃拟态背景
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(10,37,64,.4);
  backdrop-filter:blur(12px) saturate(1.2);
  -webkit-backdrop-filter:blur(12px) saturate(1.2);
  display:none;align-items:center;justify-content:center;
  padding:20px;
}
.modal-overlay.show{display:flex;animation:fade .25s}
.modal{
  width:100%;max-width:480px;
  background:var(--surface);
  border-radius:24px;
  padding:28px;
  border:1px solid var(--border);
  animation:modalIn .35s var(--ease-out);
  max-height:85vh;overflow-y:auto;
  box-shadow:0 24px 64px rgba(10,37,64,.12);
}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.modal-title{font-size:18px;font-weight:700;letter-spacing:-.3px}
.modal-close{
  font-size:13px;color:var(--text-3);
  padding:7px 14px;border-radius:9px;
  font-weight:500;
}
.modal-close:hover{background:var(--surface-3);color:var(--text-2)}

.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;color:var(--text);margin-bottom:8px;letter-spacing:.3px;font-weight:700}
.form-input,.form-select,.form-textarea{
  width:100%;padding:14px 16px;
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(10,37,64,.1);
  border-radius:var(--radius-sm);font-size:15px;
  transition:all .2s;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow-2)}
.form-input::placeholder,.form-textarea::placeholder{color:var(--text-4)}
.form-textarea{min-height:84px;line-height:1.6}
.form-row{display:flex;gap:12px}
.form-row>*{flex:1}
.btn-primary{
  width:100%;padding:15px;
  background:var(--primary-grad);color:#fff;
  border-radius:var(--radius-sm);font-size:15px;font-weight:700;
  margin-top:8px;letter-spacing:.2px;
  box-shadow:0 6px 20px rgba(99,91,255,.2),inset 0 1px 0 rgba(255,255,255,.15);
  transition:all .2s var(--ease-spring);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(99,91,255,.3)}
.btn-primary:active{transform:scale(.97)}
.chip-group{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:10px 20px;border-radius:24px;font-size:14px;font-weight:700;
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(10,37,64,.1);color:var(--text-2);
  transition:all .2s var(--ease-standard);
}
.chip:hover{border-color:var(--border-hover)}
.chip.active{background:var(--primary-glow);color:var(--primary);border-color:rgba(129,140,248,.2)}

/* ============================================================
   空状态
   ============================================================ */
.empty{
  text-align:center;padding:72px 20px;color:var(--text-3);
}
.empty svg{width:56px;height:56px;opacity:.15;margin-bottom:16px}
.empty p{font-size:15px;line-height:1.7;font-weight:600}
.empty p span{color:var(--text-2);font-size:14px;font-weight:500}

/* ============================================================
   Toast — 顶部胶囊
   ============================================================ */
.toast{
  position:fixed;top:calc(28px + var(--safe-top));left:50%;transform:translateX(-50%) translateY(-24px);
  background:var(--sidebar);border:1px solid rgba(255,255,255,.08);
  padding:13px 22px;border-radius:14px;font-size:13.5px;font-weight:600;
  z-index:300;opacity:0;transition:all .35s var(--ease-out);pointer-events:none;
  box-shadow:0 12px 40px rgba(10,37,64,.2);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:#fff;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============================================================
   加载 — 骨架屏 shimmer
   ============================================================ */
.loading{text-align:center;padding:48px;color:var(--text-3);font-size:13px}
.spinner{
  width:28px;height:28px;border:2.5px solid var(--surface-3);
  border-top-color:var(--primary);border-radius:50%;
  animation:spin .7s linear infinite;margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* 列表项进入动画 — stagger */
.list-item{animation:listIn .4s var(--ease-out) both}
@keyframes listIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============================================================
   PWA 安装引导
   ============================================================ */
.pwa-guide{
  position:fixed;inset:0;z-index:400;
  background:rgba(10,37,64,.4);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  display:none;align-items:center;justify-content:center;
  padding:20px;
}
.pwa-guide.show{display:flex;animation:fade .3s}
.pwa-guide-card{
  background:var(--surface);
  border-radius:24px;
  padding:32px 28px 28px;
  border:1px solid var(--border);
  max-width:400px;width:100%;
  box-shadow:0 24px 64px rgba(10,37,64,.15);
  animation:modalIn .35s var(--ease-out);
  text-align:center;
}
.pwa-guide-icon{
  width:88px;height:88px;
  border-radius:22px;
  background:linear-gradient(135deg,#C7A84B 0%,#D4AF37 100%);
  margin:0 auto 20px;
  display:flex;align-items:center;justify-content:center;
  font-size:40px;font-weight:700;color:#0A2540;
  box-shadow:0 12px 32px rgba(199,168,75,.3),inset 0 1px 0 rgba(255,255,255,.3);
}
.pwa-guide-title{font-size:20px;font-weight:700;margin-bottom:10px;letter-spacing:-.3px}
.pwa-guide-desc{font-size:13.5px;color:var(--text-2);line-height:1.65;margin-bottom:24px}
.pwa-guide-steps{text-align:left;background:rgba(255,255,255,.4);padding:18px;border-radius:14px;margin-bottom:24px;border:1px solid rgba(10,37,64,.08)}
.pwa-guide-steps .step{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;font-size:13.5px;color:var(--text-2);line-height:1.5}
.pwa-guide-steps .step:last-child{margin-bottom:0}
.pwa-guide-steps .num{
  flex-shrink:0;
  width:22px;height:22px;border-radius:50%;
  background:var(--primary-glow);color:var(--primary);
  font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  margin-top:1px;
}
.btn-secondary{
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-2);
  width:100%;padding:13px;
  border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;
  margin-top:8px;
  transition:all .2s;
}
.btn-secondary:hover{background:var(--surface-3);color:var(--text)}

/* ============================================================
   响应式 — 移动优先
   ============================================================ */
@media(max-width:768px){
  :root{--sidebar-w:64px}
  .overview{grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px 10px}
  .topbar{padding:calc(18px + var(--safe-top)) 16px 14px}
  .content{padding:10px 16px calc(110px + var(--safe-bottom))}
  .topbar-titles h1{font-size:22px}
  .ov-card .value{font-size:22px}
  .ov-card{padding:16px}
  .todo-actions,.plan-actions{opacity:1}
  .fab{right:16px;bottom:calc(16px + var(--safe-bottom))}
  .modal{margin:0;max-width:100%;border-radius:20px}
  .review-form-card{padding:18px}
  .plan-stats{gap:20px}
}
@media(max-width:480px){
  .sidebar:hover{width:var(--sidebar-w)}
  .sidebar:hover .nav-item .nav-label{opacity:0}
  .sidebar:hover .sidebar-time{opacity:0}
  .ov-card .value{font-size:20px}
}

/* 减少动效 — 无障碍 */
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>

      </div>

    <div class="ov-card">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.7 9.7 0 0 0-6.3 2.4L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/></svg>

<script>
// ============================================================
// 全局状态
// ============================================================
let currentTab = 'todos';
let currentNewsCat = 'ai';
let ledgerDisplayCount = 30;
let allLedgerItems = [];
let yearlyViewYear = new Date().getFullYear();
let selectedMood = 3;
let allReviewHistory = [];
let reviewSearchTimer = null;

const TAB_TITLES = {
  todos:'今日待办', ledger:'收支记账', news:'每日资讯',
  inspirations:'灵感记录', study:'学习计划', review:'每日复盘'
};

// ============================================================
// IndexedDB — 本地数据持久化
// ============================================================
const DB_NAME = 'LifeWorkbench';
const DB_VERSION = 1;
let db = null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('todos')){
        const s = d.createObjectStore('todos',{keyPath:'id',autoIncrement:true});
        s.createIndex('due_date','due_date',{unique:false});
        s.createIndex('done','done',{unique:false});
      }
      if(!d.objectStoreNames.contains('ledger')){
        const s = d.createObjectStore('ledger',{keyPath:'id',autoIncrement:true});
        s.createIndex('record_date','record_date',{unique:false});
        s.createIndex('type','type',{unique:false});
      }
      if(!d.objectStoreNames.contains('inspirations')){
        const s = d.createObjectStore('inspirations',{keyPath:'id',autoIncrement:true});
        s.createIndex('created_at','created_at',{unique:false});
      }
      if(!d.objectStoreNames.contains('plans')){
        d.createObjectStore('plans',{keyPath:'id',autoIncrement:true});
      }
      if(!d.objectStoreNames.contains('checkins')){
        const s = d.createObjectStore('checkins',{keyPath:'id',autoIncrement:true});
        s.createIndex('plan_id','plan_id',{unique:false});
        s.createIndex('checkin_date','checkin_date',{unique:false});
      }
      if(!d.objectStoreNames.contains('reviews')){
        const s = d.createObjectStore('reviews',{keyPath:'id',autoIncrement:true});
        s.createIndex('review_date','review_date',{unique:false});
      }
      if(!d.objectStoreNames.contains('meta')){
        d.createObjectStore('meta',{keyPath:'key'});
      }
    };
    req.onsuccess = e=>{ db = e.target.result; resolve(db); };
    req.onerror = e=>reject(e.target.error);
  });
}

function tx(store, mode='readonly'){
  return db.transaction(store, mode).objectStore(store);
}

function dbGet(store, key){
  return new Promise((resolve,reject)=>{
    const r = tx(store).get(key);
    r.onsuccess = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
  });
}

function dbAll(store){
  return new Promise((resolve,reject)=>{
    const r = tx(store).getAll();
    r.onsuccess = ()=>resolve(r.result||[]);
    r.onerror = ()=>reject(r.error);
  });
}

function dbAdd(store, obj){
  return new Promise((resolve,reject)=>{
    const r = tx(store,'readwrite').add(obj);
    r.onsuccess = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
  });
}

function dbPut(store, obj){
  return new Promise((resolve,reject)=>{
    const r = tx(store,'readwrite').put(obj);
    r.onsuccess = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
  });
}

function dbDelete(store, key){
  return new Promise((resolve,reject)=>{
    const r = tx(store,'readwrite').delete(key);
    r.onsuccess = ()=>resolve();
    r.onerror = ()=>reject(r.error);
  });
}

function dbClear(store){
  return new Promise((resolve,reject)=>{
    const r = tx(store,'readwrite').clear();
    r.onsuccess = ()=>resolve();
    r.onerror = ()=>reject(r.error);
  });
}

function dbIndexAll(store, indexName, value){
  return new Promise((resolve,reject)=>{
    const r = tx(store).index(indexName).getAll(value);
    r.onsuccess = ()=>resolve(r.result||[]);
    r.onerror = ()=>reject(r.error);
  });
}

// meta键值存储
function metaGet(key){
  return dbGet('meta',key).then(r=>r?r.value:null).catch(()=>null);
}
function metaSet(key,value){
  return dbPut('meta',{key,value});
}

// ============================================================
// 工具函数
// ============================================================
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function fmtMoney(n){
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  return sign + '¥' + abs.toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2});
}
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  const now = new Date();
  const isToday = dt.toDateString() === now.toDateString();
  if(isToday) return '今天';
  const y = new Date(); y.setDate(y.getDate()-1);
  if(dt.toDateString()===y.toDateString()) return '昨天';
  return `${dt.getMonth()+1}月${dt.getDate()}日`;
}
function fmtFullDate(){
  const d = new Date();
  const week = ['日','一','二','三','四','五','六'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 星期${week[d.getDay()]}`;
}
function fmtTime(){
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function localDate(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'),2000);
}

// ============================================================
// 导航
// ============================================================
function switchTab(tab){
  currentTab = tab;
  $$('.section').forEach(s=>s.classList.remove('active'));
  $('#sec-'+tab).classList.add('active');
  $$('.nav-item').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  $('#hdrTitle').textContent = TAB_TITLES[tab];
  $('.content').scrollTop = 0;
  loadTabData(tab);
}
$$('.nav-item').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));

function loadTabData(tab){
  if(tab==='todos') loadTodos();
  else if(tab==='ledger') loadLedger();
  else if(tab==='news') loadNews(currentNewsCat);
  else if(tab==='inspirations') loadInspirations();
  else if(tab==='study') loadPlans();
  else if(tab==='review') loadReviews();
}

// ============================================================
// 概览 — 从本地数据聚合
// ============================================================
async function loadOverview(){
  try{
    const today = localDate();
    const todos = await dbAll('todos');
    const todayTodos = todos.filter(t=>t.due_date===today);
    const doneCount = todayTodos.filter(t=>t.done).length;
    $('#ovTodo').textContent = `${doneCount}/${todayTodos.length}`;
    $('#ovTodoSub').textContent = todayTodos.length>0 ? `已完成 ${Math.round(doneCount/todayTodos.length*100)}%` : '暂无待办';

    const m = today.slice(0,7);
    const ledger = await dbAll('ledger');
    const monthItems = ledger.filter(l=>l.record_date && l.record_date.slice(0,7)===m);
    const income = monthItems.filter(l=>l.type==='income').reduce((s,l)=>s+l.amount,0);
    const expense = monthItems.filter(l=>l.type==='expense').reduce((s,l)=>s+l.amount,0);
    const balance = income - expense;
    $('#ovBalance').textContent = fmtMoney(balance);
    $('#ovBalanceSub').textContent = `收 ${fmtMoney(income)} · 支 ${fmtMoney(expense)}`;

    const plans = await dbAll('plans');
    const checkins = await dbAll('checkins');
    const todayCheckins = checkins.filter(c=>c.checkin_date===today);
    const doneToday = plans.filter(p=>todayCheckins.some(c=>c.plan_id===p.id)).length;
    $('#ovStudy').textContent = `${doneToday}/${plans.length}`;
    $('#ovStudySub').textContent = plans.length>0 ? '今日打卡' : '暂无计划';

    const reviews = await dbAll('reviews');
    const todayReview = reviews.find(r=>r.review_date===today);
    if(todayReview){
      $('#ovReview').textContent = '✓';
      $('#ovReviewSub').textContent = '已完成';
    }else{
      $('#ovReview').textContent = '—';
      $('#ovReviewSub').textContent = '未填写';
    }
  }catch(e){console.error(e)}
}

// ============================================================
// 待办 — CRUD via IndexedDB
// ============================================================
async function loadTodos(){
  const list = $('#todoList');
  list.innerHTML = '<div class="loading"><div class="spinner"></div>加载中</div>';
  try{
    const today = localDate();
    const allTodos = await dbAll('todos');
    const items = allTodos.filter(t=>t.due_date===today).sort((a,b)=>{
      if(a.done!==b.done) return a.done?1:-1;
      if(a.priority!==b.priority) return a.priority-b.priority;
      return 0;
    });
    $('#todoCount').textContent = `${items.length} 项`;
    if(!items.length){
      list.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><p>还没有待办事项<br><span>点击右下角 + 添加</span></p></div>`;
      return;
    }
    list.innerHTML = items.map(t=>`
      <div class="todo-item list-item ${t.done?'done':''}" data-id="${t.id}">
        <div class="todo-check ${t.done?'done':''}" onclick="toggleTodo(${t.id})">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="todo-body">
          <div class="todo-title">${escapeHtml(t.title)}</div>
          <div class="todo-meta">
            ${t.category?`<span class="tag cat-${t.category==='工作'?'work':t.category==='学习'?'study':'life'}">${escapeHtml(t.category)}</span>`:''}
            ${t.priority===1?`<span class="tag p1">高优先级</span>`:''}
            ${t.due_date?`<span class="tag">${fmtDate(t.due_date)}</span>`:''}
            ${t.remind_time?`<span class="tag" style="background:var(--amber-glow);color:var(--amber)">⏰ ${t.remind_time}</span>`:''}
            ${t.done&&t.done_at?`<span class="tag done-tag">${fmtDate(t.done_at)}完成</span>`:''}
          </div>
          ${t.remind_time&&!t.done?`<button class="remind-btn" onclick="event.stopPropagation();addToReminders(${t.id})">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            添加到日历提醒
          </button>`:''}
        </div>
        <div class="todo-actions">
          <button class="icon-btn" onclick="event.stopPropagation();editTodo(${t.id})">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
          </button>
          <button class="icon-btn" onclick="event.stopPropagation();delTodo(${t.id})">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
          </button>
        </div>
      </div>
    `).join('');
  }catch(e){list.innerHTML='<div class="loading">加载失败</div>';console.error(e)}
}

async function toggleTodo(id){
  try{
    const t = await dbGet('todos',id);
    if(!t) return;
    t.done = !t.done;
    t.done_at = t.done ? new Date().toISOString() : null;
    await dbPut('todos',t);
    loadTodos(); loadOverview(); autoBackup();
  }catch(e){toast('操作失败')}
}

// 前端生成 .ics 日历文件 — 无需后端
function generateICS(todo){
  const dt = new Date(`${todo.due_date}T${todo.remind_time}:00`);
  const dtStr = dt.getFullYear() +
    String(dt.getMonth()+1).padStart(2,'0') +
    String(dt.getDate()).padStart(2,'0') +
    'T' + String(dt.getHours()).padStart(2,'0') +
    String(dt.getMinutes()).padStart(2,'0') +
    '00';
  const uid = `workbench-${todo.id}-${Date.now()}@life-workbench`;
  return `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Life Workbench//CN
CALSCALE:GREGORIAN
METHOD:PUBLISH
BEGIN:VTIMEZONE
TZID:Asia/Shanghai
BEGIN:STANDARD
DTSTART:19700101T000000
TZOFFSETFROM:+0800
TZOFFSETTO:+0800
END:STANDARD
END:VTIMEZONE
BEGIN:VEVENT
UID:${uid}
DTSTAMP:${dtStr}
DTSTART;TZID=Asia/Shanghai:${dtStr}
SUMMARY:${escapeHtml(todo.title)}
DESCRIPTION:${escapeHtml(todo.title)}
BEGIN:VALARM
TRIGGER:-PT15M
ACTION:DISPLAY
DESCRIPTION:${escapeHtml(todo.title)}
END:VALARM
END:VEVENT
END:VCALENDAR`;
}

function downloadICS(content, filename){
  const blob = new Blob([content], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

async function addToReminders(id){
  try{
    const t = await dbGet('todos',id);
    if(!t){ toast('待办不存在'); return; }
    if(!t.remind_time){ toast('该待办未设置提醒时间'); return; }
    const ics = generateICS(t);
    downloadICS(ics, `workbench-todo-${id}.ics`);
    toast('已下载日历文件，请在弹出窗口中添加');
  }catch(e){ toast('操作失败'); console.error(e); }
}

async function syncAllToReminders(){
  try{
    const today = localDate();
    const allTodos = await dbAll('todos');
    const items = allTodos.filter(t=>t.due_date===today && t.remind_time && !t.done);
    if(!items.length){ toast('今日没有设置了提醒时间的待办'); return; }
    // 生成包含所有待办的综合 .ics
    let ics = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Life Workbench//CN
CALSCALE:GREGORIAN
METHOD:PUBLISH
BEGIN:VTIMEZONE
TZID:Asia/Shanghai
BEGIN:STANDARD
DTSTART:19700101T000000
TZOFFSETFROM:+0800
TZOFFSETTO:+0800
END:STANDARD
END:VTIMEZONE
`;
    for(const t of items){
      const dt = new Date(`${t.due_date}T${t.remind_time}:00`);
      const dtStr = dt.getFullYear() +
        String(dt.getMonth()+1).padStart(2,'0') +
        String(dt.getDate()).padStart(2,'0') +
        'T' + String(dt.getHours()).padStart(2,'0') +
        String(dt.getMinutes()).padStart(2,'0') +
        '00';
      ics += `BEGIN:VEVENT
UID:workbench-${t.id}-${Date.now()}@life-workbench
DTSTAMP:${dtStr}
DTSTART;TZID=Asia/Shanghai:${dtStr}
SUMMARY:${escapeHtml(t.title)}
DESCRIPTION:${escapeHtml(t.title)}
BEGIN:VALARM
TRIGGER:-PT15M
ACTION:DISPLAY
DESCRIPTION:${escapeHtml(t.title)}
END:VALARM
END:VEVENT
`;
    }
    ics += 'END:VCALENDAR';
    downloadICS(ics, `workbench-today-${today}.ics`);
    toast(`已同步 ${items.length} 条待办到日历文件`);
  }catch(e){ toast('操作失败'); console.error(e); }
}

async function delTodo(id){
  if(!confirm('删除这条待办？')) return;
  await dbDelete('todos',id);
  toast('已删除'); loadTodos(); loadOverview(); autoBackup();
}

async function editTodo(id){
  const t = await dbGet('todos',id);
  if(t) showTodoModal(t);
}

// 记账 — CRUD via IndexedDB
// ============================================================
async function loadLedger(){
  const list = $('#ledgerList');
  const m = localDate().slice(0,7);
  $('#ledgerMonth').textContent = m;
  ledgerDisplayCount = 30;
  try{
    const items = await dbAll('ledger');
    const monthItems = items.filter(l=>l.record_date && l.record_date.slice(0,7)===m);
    const income = monthItems.filter(l=>l.type==='income').reduce((s,l)=>s+l.amount,0);
    const expense = monthItems.filter(l=>l.type==='expense').reduce((s,l)=>s+l.amount,0);
    const balance = income - expense;
    $('#lsIncome').textContent = fmtMoney(income);
    $('#lsExpense').textContent = fmtMoney(expense);
    $('#lsBalance').textContent = fmtMoney(balance);
    allLedgerItems = items.sort((a,b)=>{
      const da = a.record_date||'';
      const db2 = b.record_date||'';
      if(da!==db2) return db2.localeCompare(da);
      return (b.id||0)-(a.id||0);
    });
    renderLedger();
    loadYearlyStats();
  }catch(e){list.innerHTML='<div class="loading">加载失败</div>';console.error(e)}
}

function renderLedger(){
  const list = $('#ledgerList');
  const items = allLedgerItems;
  if(!items.length){
    list.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 6-6"/></svg><p>还没有记账记录<br><span>点击右下角 + 记一笔</span></p></div>`;
    return;
  }
  const catIcons = {'餐饮':'🍽️','交通':'🚗','购物':'🛍️','娱乐':'🎮','住房':'🏠','医疗':'💊','教育':'📚','工资':'💼','奖金':'🎁','投资':'📈','其他':'📝'};
  const shown = items.slice(0, ledgerDisplayCount);
  list.innerHTML = shown.map(it=>`
    <div class="ledger-item list-item" data-id="${it.id}">

async function loadYearlyStats(){
  const container = $('#yearlyStats');
  if(!container) return;
  container.innerHTML = '<div class="loading"><div class="spinner"></div>加载中</div>';
  $('#yearLabel').textContent = yearlyViewYear;
  try{
    const items = await dbAll('ledger');
    const yearItems = items.filter(l=>l.record_date && l.record_date.slice(0,4)==String(yearlyViewYear));
    const totalIncome = yearItems.filter(l=>l.type==='income').reduce((s,l)=>s+l.amount,0);
    const totalExpense = yearItems.filter(l=>l.type==='expense').reduce((s,l)=>s+l.amount,0);
    const totalBalance = totalIncome - totalExpense;
    let html = `
      <div class="ledger-summary" style="margin-bottom:12px">
        <div class="ls-cell income"><div class="l">全年收入</div><div class="v" style="font-size:16px">${fmtMoney(totalIncome)}</div></div>
        <div class="ls-cell expense"><div class="l">全年支出</div><div class="v" style="font-size:16px">${fmtMoney(totalExpense)}</div></div>
        <div class="ls-cell"><div class="l">全年结余</div><div class="v" style="font-size:16px;color:${totalBalance>=0?'var(--green)':'var(--red)'}">${fmtMoney(totalBalance)}</div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
    `;
    const months = [];
    for(let i=1;i<=12;i++){
      const mStr = String(i).padStart(2,'0');
      const mItems = yearItems.filter(l=>l.record_date.slice(5,7)===mStr);
      const income = mItems.filter(l=>l.type==='income').reduce((s,l)=>s+l.amount,0);
      const expense = mItems.filter(l=>l.type==='expense').reduce((s,l)=>s+l.amount,0);
      months.push({month_num:i, income, expense, balance:income-expense});
    }
    const maxAbs = Math.max(...months.map(m=>Math.max(m.income, m.expense, 1)), 1);
    for(const m of months){
      const hasData = m.income > 0 || m.expense > 0;
      const balColor = m.balance >= 0 ? 'var(--green)' : 'var(--red)';
      html += `
        <div class="card-base" style="padding:12px 14px;${hasData?'':'opacity:.4'}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-size:13px;font-weight:600">${m.month_num}月</span>
            <span style="font-size:12px;color:${balColor};font-weight:600;font-variant-numeric:tabular-nums">${m.balance>=0?'+':''}${fmtMoney(m.balance).replace('¥','')}</span>
          </div>
          ${hasData ? `
          <div style="display:flex;gap:8px;align-items:center">
            <div style="flex:1;display:flex;flex-direction:column;gap:3px">
              <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-3)">
                <span>收 ${fmtMoney(m.income).replace('¥','')}</span>
                <span>支 ${fmtMoney(m.expense).replace('¥','')}</span>
              </div>
              <div style="display:flex;gap:2px;height:4px">
                <div style="flex:${m.income};background:var(--green);border-radius:2px;min-width:${m.income>0?'4':'0'}px"></div>
                <div style="flex:${m.expense};background:var(--red);border-radius:2px;min-width:${m.expense>0?'4':'0'}px"></div>
              </div>
            </div>
          </div>` : `<div style="font-size:11px;color:var(--text-4)">无记录</div>`}
        </div>
      `;
    }
    html += '</div>';
    container.innerHTML = html;
  }catch(e){container.innerHTML='<div class="loading">加载失败</div>';console.error(e)}
}

const RSS_FEEDS = {
  ai: [
    'https://news.qq.com/ninja/ai/rss.xml',
    'https://www.36kr.com/feed',
  ],
  finance: [
    'https://rsshub.app/wallstreetcn/news/global',
    'https://rsshub.app/caixin/latest',
  ]
};

async function loadNews(cat){
  const list = $('#newsList');
  list.innerHTML = '<div class="loading"><div class="spinner"></div>加载中</div>';
  try{
    const feeds = RSS_FEEDS[cat]||RSS_FEEDS.ai;
    const allItems = [];
    for(const url of feeds){
      try{
        const items = await fetchRSS(url);
        allItems.push(...items);
      }catch(e){ console.error('RSS fetch error:',url,e); }
    }
    // 去重、排序
    const seen = new Set();
    const unique = allItems.filter(i=>{
      if(seen.has(i.title)) return false;
      seen.add(i.title);
      return true;
    }).sort((a,b)=>{
      const da = a.published_at ? new Date(a.published_at).getTime() : 0;
      const db2 = b.published_at ? new Date(b.published_at).getTime() : 0;
      return db2 - da;
    }).slice(0, 40);

    if(!unique.length){
      list.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2z"/><path d="M18 14h-8M15 18h-5"/></svg><p>暂无资讯<br><span>资讯源暂时不可用</span></p></div>`;
      return;
    }
    list.innerHTML = unique.map(n=>`
      <a class="news-item list-item" href="${n.link||'#'}" target="_blank" rel="noopener">
        <div class="news-title">${escapeHtml(n.title)}</div>
        ${n.summary?`<div class="news-summary">${escapeHtml(n.summary)}</div>`:''}
        <div class="news-meta">
          ${n.source?`<span class="news-source">${escapeHtml(n.source)}</span>`:''}
          ${n.source&&n.published_at?`<span class="news-dot"></span>`:''}
          ${n.published_at?`<span>${fmtDate(n.published_at)}</span>`:''}
        </div>
      </a>
    `).join('');
  }catch(e){list.innerHTML='<div class="loading">加载失败</div>';console.error(e)}
}

async function fetchRSS(url){
  // 使用 rss2json API 作为代理
  const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
  const res = await fetch(apiUrl);
  if(!res.ok) throw new Error('RSS fetch failed');
  const data = await res.json();
  if(data.status !== 'ok') throw new Error('RSS2JSON error');
  return (data.items||[]).map(item=>({
    title: item.title,
    link: item.link,
    summary: stripHtml(item.description||'').slice(0,120),
    source: data.feed && data.feed.title ? data.feed.title.split(' - ')[0] : '',
    published_at: item.pubDate
  }));
}

function stripHtml(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}

async function loadPlans(){
  const list = $('#planList');

  try{
    const items = await dbAll('plans');
    const checkins = await dbAll('checkins');
    const today = localDate();
    $('#planCount').textContent = `${items.length} 个`;
    if(!items.length){
      list.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg><p>还没有学习计划<br><span>定个目标，每天打卡</span></p></div>`;

      const pCheckins = checkins.filter(c=>c.plan_id===p.id);

      const totalHours = pCheckins.reduce((s,c)=>s+c.hours,0);
      const progress = p.total_days ? Math.min(100, Math.round(pCheckins.length/p.total_days*100)) : 0;
      const hourProgress = p.target_hours ? Math.min(100, Math.round(totalHours/p.target_hours*100)) : 0;
      return `
      <div class="plan-item list-item" data-id="${p.id}">
        <div class="plan-head">
          <div>
            <div class="plan-title">${escapeHtml(p.title)}</div>
            ${p.note?`<div class="plan-note">${escapeHtml(p.note)}</div>`:''}
          </div>
          <button class="plan-checkin-btn ${checkedToday?'done':''}" onclick="studyCheckin(${p.id})">
            ${checkedToday?`已打卡 ${todayHours}h`:'打卡'}
          </button>
        </div>
        <div class="plan-stats">
          <div class="plan-stat"><b>${pCheckins.length}</b>/${p.total_days}天</div>
          <div class="plan-stat"><b>${totalHours}</b>/${p.target_hours}小时</div>
          <div class="plan-stat">从 ${fmtDate(p.start_date)}</div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${Math.max(progress,hourProgress)}%"></div></div>
        <div class="plan-actions">
          <button class="icon-btn" onclick="editPlan(${p.id})">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>

async function loadReviews(){
  try{
    const today = localDate();
    const reviews = await dbAll('reviews');
    const todayReview = reviews.find(r=>r.review_date===today);
    if(todayReview){
      $('#rvWell').value = todayReview.went_well||'';
      $('#rvWrong').value = todayReview.went_wrong||'';
      $('#rvImprove').value = todayReview.improvement||'';
      selectedMood = todayReview.mood||3;
      $$('.mood-btn').forEach(b=>b.classList.toggle('active', +b.dataset.mood===selectedMood));
    }
    allReviewHistory = reviews.sort((a,b)=>{
      const da = a.review_date||'';
      const db2 = b.review_date||'';
      return db2.localeCompare(da);
    });
    renderReviewHistory(allReviewHistory);
  }catch(e){console.error(e)}
}

function searchReviews(){
  clearTimeout(reviewSearchTimer);
  reviewSearchTimer = setTimeout(()=>{
    const q = $('#reviewSearch').value.trim();
    if(!q){
      renderReviewHistory(allReviewHistory);
      return;
    }
    const results = allReviewHistory.filter(r=>{
      return (r.went_well||'').includes(q) ||
             (r.went_wrong||'').includes(q) ||
             (r.improvement||'').includes(q) ||
             (r.review_date||'').includes(q);
    });
    renderReviewHistory(results, q);
  }, 300);
}

function renderReviewHistory(history, query){
  const hist = history.filter(r=>r.review_date !== localDate());
  if(!hist.length){
    $('#reviewHistory').innerHTML = query
      ? `<div class="empty" style="padding:30px"><p>没有找到匹配"${escapeHtml(query)}"的复盘</p></div>`
      : '<div class="empty" style="padding:30px"><p>还没有历史复盘</p></div>';
    return;
  }
  const moodEmoji = {1:'😞',2:'😕',3:'😐',4:'🙂',5:'😄'};
  const reviewDisplayCount = 30;
  const shown = hist.slice(0, reviewDisplayCount);
  const highlight = (text) => {
    if(!query || !text) return escapeHtml(text);
    const escaped = escapeHtml(text);
    const reg = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
    return escaped.replace(reg, '<mark style="background:var(--amber-glow);color:var(--amber);padding:0 2px;border-radius:2px">$1</mark>');
  };
  $('#reviewHistory').innerHTML = shown.map(r=>`
    <div class="review-history-item list-item">
      <div class="rh-date">${fmtDate(r.review_date)} ${moodEmoji[r.mood]||''}</div>
      ${r.went_well?`<div class="rh-row"><span class="k">✓</span>${highlight(r.went_well)}</div>`:''}
      ${r.went_wrong?`<div class="rh-row"><span class="k">✗</span>${highlight(r.went_wrong)}</div>`:''}
      ${r.improvement?`<div class="rh-row"><span class="k">→</span>${highlight(r.improvement)}</div>`:''}
    </div>
  `).join('');
  if(hist.length > reviewDisplayCount){
    $('#reviewHistory').innerHTML += `<div style="text-align:center;padding:12px;color:var(--text-3);font-size:12px">还有 ${hist.length - reviewDisplayCount} 条历史复盘未显示</div>`;
  }
}

$$('.mood-btn').forEach(b=>b.addEventListener('click',()=>{
  $$('.mood-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');

async function saveReview(){
  const data = {
    went_well: $('#rvWell').value.trim(),
    went_wrong: $('#rvWrong').value.trim(),
    improvement: $('#rvImprove').value.trim(),
    mood: selectedMood,
    review_date: localDate()
  };
  if(!data.went_well && !data.went_wrong && !data.improvement){ toast('请至少填写一项'); return; }
  try{
    const reviews = await dbAll('reviews');
    const existing = reviews.find(r=>r.review_date===data.review_date);
    if(existing){
      existing.went_well = data.went_well;
      existing.went_wrong = data.went_wrong;
      existing.improvement = data.improvement;
      existing.mood = data.mood;
      await dbPut('reviews', existing);
    }else{
      await dbAdd('reviews', data);
    }
    toast('复盘已保存'); loadReviews(); loadOverview(); autoBackup();
  }catch(e){toast('保存失败');console.error(e)}
}

async function submitTodo(id){
  const title = $('#fTodoTitle').value.trim();
  if(!title){toast('请输入事项');return}
  const category = $('#fTodoCat .chip.active')?.dataset.val || '生活';
  const priority = +$('#fTodoPri .chip.active')?.dataset.val || 2;
  const due_date = $('#fTodoDate').value || null;
  const remind_time = $('#fTodoRemind').value || null;
  try{
    if(id){
      const t = await dbGet('todos',id);
      if(t){
        t.title=title; t.category=category; t.priority=priority;
        t.due_date=due_date; t.remind_time=remind_time;
        await dbPut('todos',t);
      }
      toast('已保存');
    }else{
      await dbAdd('todos',{title,category,priority,due_date,remind_time,done:false,created_at:new Date().toISOString()});
      toast('已添加');
    }
    closeModal(); loadTodos(); loadOverview(); autoBackup();
  }catch(e){toast('操作失败');console.error(e)}
}

function showLedgerModal(it){
  const isEdit = !!it;
  it = it||{type:'expense',amount:'',category:'餐饮',note:'',record_date:localDate()};
  const expCats = ['餐饮','交通','购物','娱乐','住房','医疗','教育','其他'];
  const incCats = ['工资','奖金','投资','其他'];
  const cats = it.type==='income'?incCats:expCats;
  openModal(`
    <div class="modal-head">
      <div class="modal-title">${isEdit?'编辑记录':'记一笔'}</div>
      <button class="modal-close" onclick="closeModal()">取消</button>
    </div>
    <div class="form-group">
      <label>类型</label>
      <div class="chip-group" id="fLedgerType">
        <button class="chip ${it.type==='expense'?'active':''}" data-val="expense">支出</button>
        <button class="chip ${it.type==='income'?'active':''}" data-val="income">收入</button>
      </div>
    </div>
    <div class="form-group">
      <label>金额</label>
      <input class="form-input" type="number" step="0.01" id="fLedgerAmount" value="${it.amount}" placeholder="0.00">
    </div>
    <div class="form-group">
      <label>分类</label>
      <div class="chip-group" id="fLedgerCat">
        ${cats.map(c=>`<button class="chip ${it.category===c?'active':''}" data-val="${c}">${c}</button>`).join('')}
      </div>
    </div>
    <div class="form-group">
      <label>备注</label>
      <input class="form-input" id="fLedgerNote" value="${escapeHtml(it.note)}" placeholder="可选">
    </div>
    <div class="form-group">
      <label>日期</label>
      <input class="form-input" type="date" id="fLedgerDate" value="${it.record_date}">
    </div>
    <button class="btn-primary" onclick="submitLedger(${it.id||0})">${isEdit?'保存':'记录'}</button>
  `);
  $('#fLedgerType').addEventListener('click',e=>{
    if(e.target.classList.contains('chip')){
      $$('#fLedgerType .chip').forEach(c=>c.classList.remove('active'));
      e.target.classList.add('active');
      const isIncome = e.target.dataset.val==='income';
      const newCats = isIncome?incCats:expCats;
      $('#fLedgerCat').innerHTML = newCats.map(c=>`<button class="chip" data-val="${c}">${c}</button>`).join('');
    }
  });
  $('#fLedgerCat').addEventListener('click',e=>{ if(e.target.classList.contains('chip')){ $$('#fLedgerCat .chip').forEach(c=>c.classList.remove('active')); e.target.classList.add('active'); } });
}

async function submitLedger(id){
  const type = $('#fLedgerType .chip.active')?.dataset.val || 'expense';
  const amount = parseFloat($('#fLedgerAmount').value);
  if(!amount || amount<=0){toast('请输入金额');return}
  const category = $('#fLedgerCat .chip.active')?.dataset.val || '其他';
  const note = $('#fLedgerNote').value.trim();
  const record_date = $('#fLedgerDate').value || null;
  try{
    if(id){
      const it = await dbGet('ledger',id);
      if(it){
        it.type=type; it.amount=amount; it.category=category;
        it.note=note; it.record_date=record_date;
        await dbPut('ledger',it);
      }
      toast('已保存');
    }else{
      await dbAdd('ledger',{type,amount,category,note,record_date,created_at:new Date().toISOString()});
      toast('已记录');
    }
    closeModal(); loadLedger(); loadOverview(); autoBackup();
  }catch(e){toast('操作失败');console.error(e)}
}

// ============================================================
// 数据导出 / 导入
// ============================================================
// ============================================================
// 自动备份 + 备份提醒
// ============================================================
const BACKUP_KEY = 'last_export_time';
const AUTO_BACKUP_KEY = 'auto_backup_data';
const BACKUP_INTERVAL = 7 * 24 * 60 * 60 * 1000; // 7天

// 静默自动备份到 localStorage（每次数据变动后触发）
async function autoBackup(){
  try{
    const data = {
      todos: await dbAll('todos'),
      ledger: await dbAll('ledger'),
      inspirations: await dbAll('inspirations'),
      plans: await dbAll('plans'),
      checkins: await dbAll('checkins'),
      reviews: await dbAll('reviews'),
      autoBackupDate: new Date().toISOString(),
      version: '1.0'
    };
    localStorage.setItem(AUTO_BACKUP_KEY, JSON.stringify(data));
  }catch(e){console.warn('自动备份失败:',e)}
}

// 从 localStorage 自动备份恢复
async function restoreFromAutoBackup(){
  try{
    const raw = localStorage.getItem(AUTO_BACKUP_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    const counts = Object.values(data).filter(v=>Array.isArray(v)).reduce((s,a)=>s+a.length,0);
    if(counts===0) return false;
    // 清空所有表
    await dbClear('todos'); await dbClear('ledger'); await dbClear('inspirations');
    await dbClear('plans'); await dbClear('checkins'); await dbClear('reviews');
    if(data.todos) for(const t of data.todos) await dbAdd('todos',t);
    if(data.ledger) for(const l of data.ledger) await dbAdd('ledger',l);
    if(data.inspirations) for(const i of data.inspirations) await dbAdd('inspirations',i);
    if(data.plans) for(const p of data.plans) await dbAdd('plans',p);
    if(data.checkins) for(const c of data.checkins) await dbAdd('checkins',c);
    if(data.reviews) for(const r of data.reviews) await dbAdd('reviews',r);
    return true;
  }catch(e){console.error('恢复自动备份失败:',e); return false}
}

// 检查是否需要提醒导出备份
function checkBackupReminder(){
  const last = localStorage.getItem(BACKUP_KEY);
  if(!last){
    // 从没导出过，如果已经有数据了，提醒
    setTimeout(showBackupReminder, 2500);
    return;
  }
  const elapsed = Date.now() - parseInt(last);
  if(elapsed > BACKUP_INTERVAL){
    setTimeout(showBackupReminder, 2500);
  }
}

function showBackupReminder(){
  // 如果有弹窗了就不弹
  if($('#modalOverlay').classList.contains('show')) return;
  if($('#pwaGuide').classList.contains('show')) return;
  const last = localStorage.getItem(BACKUP_KEY);
  let daysText = '已经有一段时间';
  if(last){
    const days = Math.floor((Date.now()-parseInt(last))/86400000);
    daysText = `已经 ${days} 天`;
  }
  openModal(`
    <div class="modal-head">
      <div class="modal-title">备份数据提醒</div>
      <button class="modal-close" onclick="closeModal()">稍后</button>
    </div>
    <div style="text-align:center;padding:10px 0">
      <div style="font-size:42px;margin-bottom:10px">💾</div>
      <div style="font-size:14px;color:var(--text-2);line-height:1.65;margin-bottom:18px">
        ${daysText}没有导出数据备份了<br>
        建议定期导出，防止误操作或换设备时数据丢失<br>
        <span style="color:var(--text-4);font-size:12.5px">数据存在浏览器本地，清理浏览器数据会一起删除</span>
      </div>
      <button class="btn-primary" onclick="exportData();closeModal();">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        立即导出备份
      </button>
      <button class="btn-secondary" onclick="dismissBackupReminder()">下次再说</button>
    </div>
  `);
}

function dismissBackupReminder(){
  // 3天后再次提醒
  localStorage.setItem(BACKUP_KEY, String(Date.now() - BACKUP_INTERVAL + 3*86400000));
  closeModal();
}

async function exportData(){
  try{
    const data = {
      todos: await dbAll('todos'),
      ledger: await dbAll('ledger'),
      inspirations: await dbAll('inspirations'),
      plans: await dbAll('plans'),
      checkins: await dbAll('checkins'),
      reviews: await dbAll('reviews'),
      exportDate: new Date().toISOString(),
      version: '1.0'
    };
    const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `workbench-backup-${localDate()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    localStorage.setItem(BACKUP_KEY, String(Date.now()));
    toast('数据已导出');
  }catch(e){toast('导出失败');console.error(e)}
}

async function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  if(!confirm('导入会覆盖现有所有数据，确定继续？')){
    event.target.value = '';
    return;
  }
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    // 清空所有表
    await dbClear('todos');
    await dbClear('ledger');
    await dbClear('inspirations');
    await dbClear('plans');
    await dbClear('checkins');
    await dbClear('reviews');
    // 导入数据
    if(data.todos) for(const t of data.todos) await dbAdd('todos',t);
    if(data.ledger) for(const l of data.ledger) await dbAdd('ledger',l);
    if(data.inspirations) for(const i of data.inspirations) await dbAdd('inspirations',i);
    if(data.plans) for(const p of data.plans) await dbAdd('plans',p);
    if(data.checkins) for(const c of data.checkins) await dbAdd('checkins',c);
    if(data.reviews) for(const r of data.reviews) await dbAdd('reviews',r);
    localStorage.setItem(BACKUP_KEY, String(Date.now()));
    await autoBackup();
    toast('导入成功');
    loadOverview();
    loadReviews();
    loadTodos();
    loadLedger();
  }catch(e){
    toast('导入失败：文件格式错误');
    console.error(e);
  }
  event.target.value = '';
}

// ============================================================
// PWA 引导
// ============================================================
function detectPlatform(){
  const ua = navigator.userAgent;
  if(/iPhone|iPad|iPod/.test(ua)) return 'ios';
  if(/Android/.test(ua)) return 'android';
  if(/Windows|Mac|Linux/.test(ua)) return 'desktop';
  return 'unknown';
}

function isStandalone(){
  return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
}

function showPwaGuide(){
  if(isStandalone()) return;
  if(localStorage.getItem('pwa_guide_dismissed') === '1') return;
  const platform = detectPlatform();
  if(platform === 'desktop' || platform === 'unknown') return;
  const steps = document.getElementById('pwaSteps');
  if(platform === 'ios'){
    steps.innerHTML = `
      <div class="step"><span class="num">1</span><span>点击底部的「分享」按钮 ⬆️（向上的箭头）</span></div>
      <div class="step"><span class="num">2</span><span>在弹出菜单中选「添加到主屏幕」</span></div>
      <div class="step"><span class="num">3</span><span>点击右上角「添加」即可，名字默认为「生活工作台」</span></div>
    `;
  } else if(platform === 'android'){
    steps.innerHTML = `
      <div class="step"><span class="num">1</span><span>点击右上角菜单 ⋮</span></div>
      <div class="step"><span class="num">2</span><span>选择「添加到主屏幕」或「安装应用」</span></div>
      <div class="step"><span class="num">3</span><span>确认添加即可</span></div>
    `;
  }
  document.getElementById('pwaGuide').classList.add('show');
}

function closePwaGuide(dismiss){
  document.getElementById('pwaGuide').classList.remove('show');
  if(dismiss) localStorage.setItem('pwa_guide_dismissed', '1');
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  deferredPrompt = e;

// ============================================================
// 初始化
// ============================================================
(async function init(){
  await openDB();
  $('#hdrDate').textContent = fmtFullDate();
  $('#sidebarTime').textContent = fmtTime();
  // 检查 IndexedDB 是否为空，如果空但有自动备份，恢复
  const todoCount = (await dbAll('todos')).length;
  const ledgerCount = (await dbAll('ledger')).length;
  const reviewCount = (await dbAll('reviews')).length;
  const totalData = todoCount + ledgerCount + reviewCount;
  if(totalData === 0){
    const restored = await restoreFromAutoBackup();
    if(restored){
      toast('已自动恢复上次备份数据');
    }
  }
  loadOverview();
  loadTodos();
  // 数据变动后自动备份
  setInterval(autoBackup, 60000); // 每60秒静默备份一次
  // 检查是否需要提醒导出
  checkBackupReminder();
  setInterval(()=>{ $('#sidebarTime').textContent = fmtTime(); },1000);
  setInterval(loadOverview, 300000);
  if(!isStandalone()){
    setTimeout(showPwaGuide, 1500);
  }
})();
</script>
